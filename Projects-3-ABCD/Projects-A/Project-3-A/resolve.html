<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>وب سایت آموزش پیشرفته</title>
</head>
<body>
  <header style="background:#222; color:#eee; padding:20px; text-align:center;">
    <h1>وب‌سایت آموزشی پیشرفته</h1>
    <nav>
      <ul style="display:flex; justify-content:center; gap:20px;">
        <li><a style="color: #eee;" href="#">خانه</a></li>
        <li><a style="color: #eee;" href="#">درباره ما</a></li>
        <li><a style="color: #eee;" href="#">تماس با ما</a></li>
      </ul>
    </nav>
  </header>

  <main style="max-width:1200px; margin:20px auto; display:flex; gap:20px;">
    <section class="content" style="flex:3;">
      <article style="background:#f9f9f9; padding:15px; margin-bottom:15px;">
        <h2>دوره اول</h2>
        <img src="course1.jpg" width="300" alt="عکس دوره آموزشی">
        <p>این دوره شامل آموزش <b>HTML و CSS</b> است.</p>

        <button class="btn">ثبت نام</button>
      </article>

      <article style="background:#f9f9f9; padding:15px; margin-bottom:15px;">
        <h2>دوره دوم</h2>
        <img src="course1.jpg" alt=" عکس دوره آموزشی">
        <p>آموزش <i>جاوااسکریپت</i> برای پروژه‌های واقعی.</p> 
        <button class="btn">ثبت نام</button>
      </article>

      <section>
        <h3>فرم ثبت‌نام</h3>
        <form>
          <input type="text" name="name" placeholder="نام شما">
          <input type="email" name="email" placeholder="ایمیل شما">
          <input type="submit" value="ارسال">
        </form>
      </section>
    </section>

    <aside class="sidebar" style="flex:1; background:#eee; padding:15px;">
      <h3>لینک‌های مفید</h3>
      <ul>
        <li><a href="#">آموزش HTML</a></li>
        <li><a href="#">آموزش CSS</a></li>
        <li><a href="#">آموزش JS</a></li>
      </ul>

      <img src="advert.jpg" width="200" alt="تصویر تبلیغاتی">
    </aside>
  </main>

  <footer style="background:#666; color:#f9f9f9; text-align:center; padding:20px;">
    © ۲۰۲۵ - تمامی حقوق محفوظ است
  </footer>
</body>
</html>
